<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Machine Game</title>
  <link rel="stylesheet" href="slot_machine.css">
</head>
<body>
  <div class="container">
    <h1>🎰 Slot Machine Game 🎰</h1>

    <!-- Balance Display -->
    <div id="balance-container">
      <p>Your Balance: $<span id="balance">0</span></p>
    </div>

    <!-- Input Section -->
    <div id="controls">
      <input type="number" id="deposit-input" placeholder="Deposit Amount">
      <button id="deposit-btn">Deposit</button>

      <input type="number" id="lines-input" placeholder="Lines to Bet (1-3)" min="1" max="3">
      <input type="number" id="bet-input" placeholder="Bet per Line">
      <button id="spin-btn" disabled>Spin</button>
    </div>

    <!-- Slot Machine Display -->
    <div id="slot-machine">
      <div class="slot-row" id="row-1"></div>
      <div class="slot-row" id="row-2"></div>
      <div class="slot-row" id="row-3"></div>
    </div>

    <!-- Results Section -->
    <div id="results">
      <p id="message"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
